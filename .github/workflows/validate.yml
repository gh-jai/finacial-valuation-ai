name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate schemas and governed documents
        run: python tools/validate_schemas.py
      - name: Validate source metadata
        run: python tools/validate_sources.py
      - name: Validate atomic claims and Knowledge references
        run: python tools/validate_claims.py
      - name: Validate narrative artifacts and cross-references
        run: python tools/validate_narratives.py
      - name: Validate young-company valuations and controls
        run: python tools/validate_young_company_valuations.py
      - name: Enforce repository policy
        run: python tools/check_repository_policy.py
      - name: Run tests
        run: pytest
