repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: fvi-validate-schemas
        name: Validate FVI schemas and sample artifacts
        entry: python tools/validate_schemas.py
        language: python
        additional_dependencies: ["jsonschema>=4.21,<5", "PyYAML>=6.0,<7"]
        pass_filenames: false
      - id: fvi-validate-sources
        name: Validate FVI source metadata
        entry: python tools/validate_sources.py
        language: python
        additional_dependencies: ["jsonschema>=4.21,<5", "PyYAML>=6.0,<7"]
        pass_filenames: false
      - id: fvi-validate-claims
        name: Validate FVI atomic claims and Knowledge references
        entry: python tools/validate_claims.py
        language: python
        additional_dependencies: ["jsonschema>=4.21,<5", "PyYAML>=6.0,<7"]
        pass_filenames: false
      - id: fvi-validate-narratives
        name: Validate FVI narrative artifacts and cross-references
        entry: python tools/validate_narratives.py
        language: python
        additional_dependencies: ["jsonschema>=4.21,<5", "PyYAML>=6.0,<7"]
        pass_filenames: false
      - id: fvi-repository-policy
        name: Enforce FVI repository content policy
        entry: python tools/check_repository_policy.py
        language: python
        pass_filenames: false
