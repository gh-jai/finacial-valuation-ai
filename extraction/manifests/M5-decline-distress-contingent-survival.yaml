  implementation_sections:
    - title: Declining-company life-cycle boundary and characteristics
      printed_pages: "397-398"
    - title: Intrinsic valuation issues and dark-side controls
      printed_pages: "398-406"
    - title: Framework for decline and distress
      printed_pages: "406-411"
