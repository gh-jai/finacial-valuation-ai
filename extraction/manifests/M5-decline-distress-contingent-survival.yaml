      printed_pages: "435"
  boundary_sections:
    - title: Reversible decline and management change
      printed_pages: "407 and 410-411"
      treatment: A reviewed turnaround scenario and change probability may be composed, but Chapter 11 control-valuation mechanics are not implemented in M5.
    - title: Modified discounted cash flow valuation
      printed_pages: "414-415"
      treatment: Documents an alternative placement of distress; M5 selects the separate contingent-survival method to preserve risk separation.
    - title: Debt and hybrid claims
      printed_pages: "400 and 419"
      treatment: Current claim inventory, valuation basis, and equity-bridge handoff only; no generalized restructuring or waterfall engine.
  excluded_sections:
    - title: Relative valuation
      printed_pages: "400-401, 406, and 432-435"
      reason: M5 is a bounded intrinsic FCFF and contingent-survival vertical slice.
    - title: Simulation
      printed_pages: "413-414"
      reason: Monte Carlo simulation remains outside the v1 roadmap.
    - title: Statistical and market-implied distress-probability estimation
      printed_pages: "415-418"
      reason: M5 accepts only deterministic reviewed probabilities and does not implement a forecasting model.
    - title: Adjusted present value
      printed_pages: "424-426"
      reason: APV is an alternative valuation engine and is outside this bounded slice.
    - title: Equity as an option
      printed_pages: "426-432"
      reason: Generalized option valuation and complex claim decomposition remain outside the v1 roadmap.
    - title: Chapter notes
      printed_pages: "435-436"
      reason: Used only to verify context; no executable claim depends on copied examples, tables, or historical estimates.
artifact_goal: Declining-company and distress-adjusted intrinsic valuation composed with M2 narrative, M1 DCF, M4 forecast controls, and M3 survival semantics
