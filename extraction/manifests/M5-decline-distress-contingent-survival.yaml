limitations:
  - Chapter 11 mature-company and control-valuation methods are outside the source boundary and may be composed only through reviewed external inputs.
  - M5 does not estimate statistical, ratings-based, or bond-implied probabilities of distress; probabilities are deterministic reviewed assumptions.
  - Relative valuation, simulation, APV, equity-as-option valuation, generalized real options, and restructuring waterfalls are excluded.
  - Public examples and benchmarks must use synthetic companies and synthetic evidence.
  - M5 delegates narrative construction to WFL-NAR-001 and DCF arithmetic to WFL-VAL-001.
  - M5 may reuse M4 series and terminal-state mechanics without modifying the approved M4 contract.
  - Discrete cessation or forced-sale risk is applied once, on a declared valuation basis, and is not embedded again in FCFF or discount rates.
