artifact_goal: A cycle-aware valuation-input and judgment overlay that preserves intrinsic-value mechanics, uncertainty, and human decision authority
review_status: approved
copyright_controls:
  raw_text_committed: false
  tables_or_figures_reproduced: false
  sequential_extract_committed: false
coverage:
  - cyclical_and_commodity_boundary
  - established_cycle_vs_structural_break
  - dated_multi_dimension_evidence
  - full_input_normalization
  - transition_to_normal_controls
  - current_expectations_driver_path
  - scenario_range_without_simulation
  - company_vs_macro_view_separation
  - psychology_risk_credit_and_valuation_overlay
  - confidence_counterevidence_and_staleness
  - price_value_separation
  - no_timing_no_trade_instruction
  - M1_M2_M4_M5_composition
  - risk_and_double_counting_controls
limitations:
  - M6 does not forecast exact cycle turning points, durations, or future macro events.
  - M6 does not ingest live economic, market, credit, futures, or company data.
  - All market and company observations are dated reviewed inputs with explicit provenance.
  - M6 does not issue autonomous investment recommendations, portfolio weights, trade instructions, or leverage decisions.
  - M6 does not implement relative valuation, Monte Carlo simulation, statistical regime estimation, derivatives hedging, or real-option valuation.
  - Discrete distress and forced-sale adjustments remain exclusively governed by WFL-DST-001.
  - Psychological, risk-attitude, credit, and valuation observations cannot directly alter FCFF or discount rates without an explicit financial mapping governed by an existing workflow.
  - Public examples and benchmarks must use synthetic companies, indicators, prices, and evidence.
schema_version: 1.0.0
