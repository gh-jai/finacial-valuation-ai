  - id: CLM-VAL-DCF-012
    claim_type: derived_rule
    statement: A Gordon-growth terminal-value implementation must reject a terminal growth rate at or above the terminal discount rate.
    source_refs:
      - source_id: SRC-DAMODARAN-LBV-2024
        location: Chapter 3, PDF pages 74-76
    derivation: The perpetual-growth denominator is the terminal discount rate minus terminal growth; a non-positive denominator is not economically coherent for this workflow.
    confidence: 0.99
    status: reviewed
    reviewer: fvi-maintainers
